[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insar-deformation-monitoring"
version = "0.2.0"
description = "Dependency-free analysis of geocoded Sentinel-1 DInSAR LOS displacement exports"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Xiaoqiao Liu"}]

[project.scripts]
insar-monitor = "insar_monitor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
